name: Build unsigned Atolla IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atolla-build-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: AmpFin.xcodeproj
  SCHEME: Multiplatform
  APP_NAME: Atolla

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: AmpFin-1.6.4
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version and schemes
        run: |
          xcodebuild -version
          xcodebuild -list -project "$PROJECT"

      - name: Write unsigned build configuration
        run: |
          cat > Configuration/Release.xcconfig <<EOF
          #include "Base.xcconfig"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS =
          DEVELOPMENT_TEAM =
          BUNDLE_ID_PREFIX = io.github.${GITHUB_REPOSITORY_OWNER}
          EOF

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -n 200

      - name: Package IPA without app extensions
        run: |
          app_path=$(find build/Build/Products -maxdepth 3 -name '*.app' -type d | head -n 1)
          test -n "$app_path"
          mkdir -p Payload
          cp -R "$app_path" Payload/
          rm -rf Payload/*.app/PlugIns
          ditto -c -k --sequesterRsrc --keepParent Payload "../${APP_NAME}.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-ipa
          path: ${{ env.APP_NAME }}.ipa
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: AmpFin-1.6.4/build.log
